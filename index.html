<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F0714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Système 2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Système 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,500;0,600;1,700;1,800&family=Geist:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
html{background:#0F0714}
body{height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout : une colonne façon téléphone, centrée, onglets flottants en bas. Thème unique sombre et néon, assumé. */
:root{
  --bg:#0F0714; --bg2:#170B1E;
  --surface:rgba(255,241,232,0.045); --surface2:rgba(255,241,232,0.07);
  --line:rgba(255,241,232,0.09); --line2:rgba(255,241,232,0.14);
  --fg:#FFF1E8; --muted:#BFAFC8; --dim:#A391B0; --faint:#6E5D7D;
  --gold:#FFC65C; --amber:#FFB347; --coral:#FF7A59; --peach:#FF9A6A; --rose:#E8407A; --alert:#FF4F8B; --violet:#E07BFF; --ink:#1A0A12;
  --display:'Saira','Helvetica Neue',Arial,sans-serif;
  --body:'Geist','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:var(--gold)}
input::placeholder{color:#5E4E6C}
input:focus{outline:none}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#app{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden;isolation:isolate;background:var(--bg);transition:background-color 1.2s ease}
.orbs{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);transition:background-color 1.2s ease}
.orb.a{right:-90px;top:-70px;width:300px;height:300px;opacity:.2;animation:orbA 14s ease-in-out infinite}
.orb.b{left:95px;top:200px;width:200px;height:200px;opacity:.08;filter:blur(70px)}
.orb.c{left:-120px;top:560px;width:320px;height:320px;opacity:.16;filter:blur(90px);animation:orbB 17s ease-in-out infinite}
@keyframes orbA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,20px) scale(1.1)}}
@keyframes orbB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(24px,-16px) scale(.92)}}

.scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}
.scroll::-webkit-scrollbar{display:none}
.page{display:flex;flex-direction:column;gap:14px;padding-top:22px;padding-bottom:128px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.page.sub{padding-bottom:48px}

/* Typo */
.kicker{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;line-height:1}
.h2{font-family:var(--display);font-style:italic;font-weight:700;font-size:20px}
.num{font-family:var(--display);font-style:italic;font-weight:800;font-variant-numeric:tabular-nums}
.hero-num{font-family:var(--display);font-style:italic;font-weight:800;line-height:1;padding-right:6px;background:linear-gradient(180deg,#FFF6E6 0%,var(--g1,#FFD36E) 55%,var(--g2,#FF9A6A) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 1px rgba(255,241,232,.9)) drop-shadow(0 0 18px var(--glow,rgba(255,122,89,.45)))}
.hero-num.alert{background:none;color:var(--alert);filter:none;text-shadow:0 0 2px rgba(255,79,139,.8),0 0 22px rgba(255,79,139,.45)}
.hero-num small{font-size:.45em;margin-left:4px}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.small{font-size:12px} .p{font-size:14px;line-height:1.45;text-wrap:pretty}

/* Surfaces */
.card{position:relative;padding:16px 18px;border-radius:24px;background:var(--surface);border:1px solid var(--line);border-top-color:rgba(255,241,232,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 28px -18px rgba(0,0,0,.55)}
.card.gold{background:linear-gradient(160deg,rgba(70,38,20,.55),rgba(30,16,22,.7));border-color:rgba(255,198,92,.16);border-top-color:rgba(255,198,92,.3)}
.card.rose{background:linear-gradient(160deg,rgba(70,16,40,.55),rgba(30,10,24,.7));border-color:rgba(255,79,139,.16);border-top-color:rgba(255,79,139,.3)}
.card.violet{background:linear-gradient(160deg,rgba(44,22,56,.9),rgba(26,13,34,.94));border-color:rgba(224,123,255,.13);border-top-color:rgba(224,123,255,.26)}
.neon{position:absolute;left:30px;right:30px;top:-1px;height:1px;opacity:.78;background:linear-gradient(90deg,transparent,var(--nc,var(--coral)) 30%,var(--nc,var(--coral)) 70%,transparent);box-shadow:0 0 6px var(--nc,var(--coral))}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);border-top-color:rgba(255,241,232,.11)}
.tile .lab{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.tile .val{font-family:var(--display);font-style:italic;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Boutons */
.cta{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:66px;padding:0 9px 0 24px;border:none;border-radius:33px;background:linear-gradient(100deg,var(--g1,#FFD36E) 0%,var(--g2,#FF7A59) 50%,var(--g3,#E8407A) 100%);color:var(--ink);text-decoration:none;font-size:17px;font-weight:600;text-align:left;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px var(--g1,#FFD36E),0 0 22px -2px var(--glow,rgba(255,122,89,.55))}
.cta::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);animation:sweep 6s cubic-bezier(.6,0,.2,1) infinite}
.cta:active{transform:scale(.97)}
.cta .knob{width:48px;height:48px;flex:none;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center}
@keyframes sweep{0%{transform:translateX(-120%) skewX(-20deg)}55%,100%{transform:translateX(320%) skewX(-20deg)}}
.btn{min-height:46px;padding:0 16px;border-radius:23px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font-size:14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{border-color:rgba(255,79,139,.5);color:var(--alert);background:rgba(255,79,139,.08)}
.icon-btn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--line2);background:var(--surface);text-decoration:none}
.x-btn{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border:none;border-radius:50%;background:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,198,92,.3);background:rgba(255,198,92,.1);font-size:13px;font-weight:500;color:var(--gold)}
.seg{display:grid;gap:6px}
.seg button,.pill{min-height:44px;padding:0 10px;border-radius:22px;border:1px solid var(--line);background:rgba(255,241,232,.04);color:var(--fg);font-size:13px;font-weight:600;transition:all .2s}
.seg button[aria-pressed=true],.pill[aria-pressed=true]{background:var(--sc,var(--gold));border-color:var(--sc,var(--gold));color:var(--ink);box-shadow:0 0 16px -2px var(--sc,var(--gold))}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.switch{position:relative;width:52px;height:32px;flex:none;border:none;border-radius:16px;background:rgba(255,241,232,.14);transition:background .25s,box-shadow .25s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--fg);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.switch[aria-checked=true]{background:linear-gradient(90deg,var(--gold),var(--coral));box-shadow:0 0 14px rgba(255,122,89,.45)}
.switch[aria-checked=true]::after{transform:translateX(20px)}

/* Champs */
.field{display:flex;flex-direction:column;gap:6px;padding:14px 18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);cursor:text;transition:border-color .2s,box-shadow .2s,background-color .2s}
.field:focus-within{border-color:rgba(255,198,92,.6);background:rgba(255,198,92,.06);box-shadow:0 0 0 3px rgba(255,198,92,.12),0 0 22px rgba(255,198,92,.18)}
.field .flab{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
.field .fin{display:flex;align-items:baseline;gap:6px}
.field input{flex:1;min-width:0;height:44px;padding:0;border:none;background:transparent;color:var(--fg)}
.field input.big{font-family:var(--display);font-style:italic;font-weight:800;font-size:32px}
.field input.mid{font-family:var(--display);font-style:italic;font-weight:800;font-size:24px}
.field input.txt{font-size:17px;font-weight:500}
.field .unit{font-family:var(--display);font-style:italic;font-weight:700;font-size:19px;color:var(--peach)}
.field .per{font-size:13px;color:var(--dim)}
.field .hint{font-size:12px;color:var(--dim);line-height:1.4}
.ok{color:var(--gold)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--alert),var(--coral),var(--gold))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 4px rgba(255,79,139,.35),0 0 14px rgba(255,79,139,.6)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--alert),var(--coral),var(--gold))}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:none;border-radius:50%;background:var(--fg);box-shadow:0 0 0 4px rgba(255,79,139,.35),0 0 14px rgba(255,79,139,.6)}

/* Navigation */
nav.tabs{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:18px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px;border-radius:32px;background:rgba(32,18,44,.78);border:1px solid var(--line);border-top-color:rgba(255,241,232,.15);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 16px 32px -14px rgba(0,0,0,.6);z-index:5}
nav.tabs[hidden]{display:none}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border:none;border-radius:26px;background:transparent;color:var(--dim);font-size:11px}
nav.tabs button[aria-current=page]{background:rgba(255,198,92,.13);box-shadow:inset 0 0 0 1px rgba(255,198,92,.45),0 0 16px rgba(255,198,92,.28);color:var(--gold);font-weight:600;text-shadow:0 0 10px rgba(255,198,92,.7)}
nav.tabs button.boss[aria-current=page]{background:rgba(255,79,139,.13);box-shadow:inset 0 0 0 1px rgba(255,79,139,.45),0 0 16px rgba(255,79,139,.28);color:#FF7FA8;text-shadow:0 0 10px rgba(255,79,139,.7)}

/* Jour */
.logo{display:flex;align-items:center;gap:6px;font-family:var(--display);font-style:italic;font-weight:800;font-size:22px}
.logo b{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--g1,#FFD36E),var(--g3,#E8407A));color:var(--ink);font-size:15px;box-shadow:0 0 0 1px var(--g1,#FFD36E),0 0 14px var(--glow,rgba(255,122,89,.55))}
.gauge{position:relative;height:300px;margin:4px -18px 0 -18px}
.gauge svg{position:absolute;left:50%;top:0;margin-left:-195px;overflow:visible}
.gauge .center{position:absolute;left:0;right:0;top:106px;display:flex;flex-direction:column;align-items:center}
.gauge .under{position:absolute;left:0;right:0;top:278px;text-align:center;font-size:13px;color:var(--dim)}
.shimmer{animation:shimmer 3.5s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:.3}50%{opacity:.75}}
.twinkle{animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.banner{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;border-radius:20px;border:1px solid rgba(224,123,255,.3);background:rgba(224,123,255,.08);color:var(--fg);text-align:left}
.banner .dot{width:10px;height:10px;flex:none;border-radius:50%;background:var(--violet);box-shadow:0 0 10px var(--violet)}
.deck{position:relative;padding-bottom:14px}
.deck .ghost1,.deck .ghost2{position:absolute;height:40px;border-radius:22px;bottom:0}
.deck .ghost1{left:22px;right:22px;background:rgba(224,123,255,.03);border:1px solid rgba(224,123,255,.06)}
.deck .ghost2{left:11px;right:11px;bottom:7px;background:rgba(224,123,255,.05);border:1px solid rgba(224,123,255,.09)}
.deck .card{display:flex;gap:12px;align-items:flex-start;padding:16px 6px 16px 16px}
.exp{display:flex;align-items:center;gap:12px;min-height:54px}
.exp .ini{width:34px;height:34px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.empty{padding:14px 2px;font-size:14px;color:var(--dim);line-height:1.45}

/* Saisie */
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.keys button{min-height:54px;border:1px solid rgba(255,241,232,.07);border-top-color:rgba(255,241,232,.13);border-radius:18px;background:rgba(255,241,232,.045);font-size:22px;font-variant-numeric:tabular-nums}
.keys button:active{background:rgba(255,198,92,.15)}

/* Overlays */
.layer{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.drop{position:absolute;top:-70px;animation-timing-function:cubic-bezier(.45,.05,.75,1);animation-fill-mode:both}
.drop.l{animation-name:fallL}.drop.r{animation-name:fallR}
@keyframes fallL{0%{transform:translateY(0) rotate(0);opacity:0}8%{opacity:1}100%{transform:translateY(110vh) rotate(-280deg);opacity:1}}
@keyframes fallR{0%{transform:translateY(0) rotate(0);opacity:0}8%{opacity:1}100%{transform:translateY(110vh) rotate(320deg);opacity:1}}
.bill{width:52px;height:28px;border-radius:5px;background:linear-gradient(135deg,#FFE08A,#FF9A5A);border:1px solid rgba(42,10,22,.35);box-shadow:0 0 14px rgba(255,154,90,.45);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:13px;color:var(--ink)}
.coin{width:28px;height:28px;border-radius:50%;background:linear-gradient(180deg,#FFD36E,#FF7A59);border:2px solid rgba(255,241,232,.5);box-shadow:0 0 14px rgba(255,198,92,.6);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:12px;color:var(--ink)}
.sheet-wrap{position:absolute;inset:0;z-index:15;background:rgba(14,8,22,.82);display:flex;flex-direction:column;justify-content:flex-end;animation:fadeIn .3s ease both}
.sheet{display:flex;flex-direction:column;gap:16px;max-height:92%;overflow-y:auto;scrollbar-width:none;padding:26px max(22px,env(safe-area-inset-left,0px)) 30px max(22px,env(safe-area-inset-right,0px));border-radius:32px 32px 0 0;border-top:1px solid #5A2140;background:#170A18;animation:sheetUp .5s cubic-bezier(.2,.8,.2,1) both}
.sheet::-webkit-scrollbar{display:none}
@keyframes sheetUp{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
.jar{position:relative;width:120px;height:156px;flex:none}
.jar .neck{position:absolute;left:30px;top:0;width:60px;height:16px;border:3px solid var(--alert);border-bottom:none;border-radius:8px 8px 0 0;box-sizing:border-box}
.jar .body{position:absolute;left:0;top:14px;width:120px;height:142px;border:3px solid var(--alert);border-radius:26px 26px 34px 34px;overflow:hidden;box-sizing:border-box;box-shadow:0 0 26px rgba(255,79,139,.35)}
.jar .liquid{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--alert),#8E3FD1);transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.jar .wave{position:absolute;top:-7px;left:0;width:200%;height:14px;border-radius:45%;background:var(--alert);animation:slosh 2.4s ease-in-out infinite}
.jar .falling{position:absolute;left:46px;top:0;width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#FFD36E,#FF7A59);box-shadow:0 0 12px rgba(255,198,92,.7);animation:coinDrop 1s cubic-bezier(.5,0,.8,.6) .35s both}
@keyframes slosh{0%,100%{transform:translateX(0)}50%{transform:translateX(-25%)}}
@keyframes coinDrop{0%{transform:translateY(-70px);opacity:0}15%{opacity:1}75%{transform:translateY(110px);opacity:1}100%{transform:translateY(120px);opacity:0}}
.row-in{animation:rowIn .45s ease-out both}
@keyframes rowIn{0%{transform:translateX(-16px);opacity:0}100%{transform:translateX(0);opacity:1}}
.pop{animation:popIn .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes popIn{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.enter{animation:enter .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{0%{transform:translateY(18px);opacity:0}100%{transform:translateY(0);opacity:1}}
.pt{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;pointer-events:none;animation:burst .85s cubic-bezier(.1,.7,.3,1) both}
@keyframes burst{0%{transform:translate(0,0) scale(1.2);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.toast{position:absolute;left:50%;bottom:98px;transform:translateX(-50%);z-index:30;max-width:86%;padding:12px 18px;border-radius:20px;background:rgba(40,22,52,.95);border:1px solid var(--line2);font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:popIn .3s ease both}
.shake{animation:shake .45s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(9px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.float{animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.smoke{position:absolute;border-radius:50%;filter:blur(4px);animation:smoke 3.4s ease-out infinite}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.6}100%{transform:translateY(-70px) scale(1.6);opacity:0}}
.bar-grow{transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
.calm *, .calm *::before, .calm *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div id="app">
  <div class="orbs" aria-hidden="true"><div class="orb a" id="orbA"></div><div class="orb b" id="orbB"></div><div class="orb c" id="orbC"></div></div>
  <div class="scroll" id="scroll"><div class="loading"><span class="logo">Système<b>2</b></span><span class="small dim">Chargement de ton budget…</span></div></div>
  <nav class="tabs" id="tabs" aria-label="Navigation principale" hidden>

<script>
(function(){
'use strict';

/* ---------- Outils ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const round2 = n => Math.round(n * 100) / 100;
const money = n => { const t = Math.abs(n).toFixed(2).replace('.', ','); return (n < -0.004 ? '−' : '') + t + ' €'; };
const moneyNum = n => { const t = Math.abs(n).toFixed(2).replace('.', ','); return (n < -0.004 ? '−' : '') + t; };
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const dow = s => (parse(s).getDay() + 6) % 7; /* lundi = 0 */
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const today = () => ymd(new Date());
const monthKey = s => s.slice(0, 7);
const DAYS = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const DSHORT = ['L','M','M','J','V','S','D'];
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const fmtDay = s => { const d = parse(s); return DAYS[dow(s)].slice(0,3) + '. ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0,4) + (MONTHS[d.getMonth()].length > 4 ? '.' : ''); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- Stockage : base de l'artifact si dispo, sinon navigateur ---------- */
const Store = {
  mode: 'local', db: null, uid: null,
  async init(){
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const timeout = new Promise(r => setTimeout(() => r(null), 7000));
        const got = await Promise.race([Promise.all([window.claude.use('db'), window.claude.use('user')]), timeout]);
        if (got && got[0] && got[1]) {
          const id = await got[1].id();
          if (id) { this.db = got[0]; this.uid = id; this.mode = 'db'; }
        }
      }
    } catch (e) { this.mode = 'local'; }
  },
  path(key){ return 'data/users/' + this.uid + '/' + key; },
  async get(key){
    if (this.mode === 'db') {
      try { const s = await this.db.doc(this.path(key)).get(); return s.exists ? JSON.parse(JSON.stringify(s.data())) : null; }
      catch (e) { await new Promise(r => setTimeout(r, 600)); try { const s = await this.db.doc(this.path(key)).get(); return s.exists ? JSON.parse(JSON.stringify(s.data())) : null; } catch (e2) { return null; } }
    }
    try { const v = localStorage.getItem('s2:' + key); return v ? JSON.parse(v) : null; } catch (e) { return null; }
  },
  async set(key, val){
    if (this.mode === 'db') {
      try { await this.db.doc(this.path(key)).set(val); return true; }
      catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 700)); try { await this.db.doc(this.path(key)).set(val); return true; } catch (e2) {} } toast('Sauvegarde impossible pour le moment. Réessaie dans un instant.'); return false; }
    }
    try { localStorage.setItem('s2:' + key, JSON.stringify(val)); return true; } catch (e) { return false; }
  }
};

/* ---------- État ---------- */
const DEFAULTS = { income:'', other:'', fixed:'', saving:'', payday:'1', goalName:'', goalAmount:'', evening:'ask', expire:'week', threshold:20, enemy:'CBD', enemyCost:'', rule:'stop', weeklyCap:'', rEvening:true, eveHour:'21', rSunday:true, rNudge:true, rBias:true, amb:'auto', tone:'ironic', vibe:true, reduced:false };
let S = null;            /* document "state" */
const M = {};            /* mois chargés : 'YYYY-MM' -> {expenses:[]} */
let view = 'jour';
let ui = { journal: { range:'7', cat:null, q:'' }, editNote: null, biasShift: 0, lastShown: null, saisie: null, sheet: null, confirmReset: false, useAmount: '' };

function freshState(){
  const t = today();
  return { v:1, settings: Object.assign({}, DEFAULTS), carry:0, cagnotte:0, startDate:t, lastClosed:addDays(t,-1), streak:0, bestStreak:0, celebrate:0,
    dayLog:{}, dayNotes:{}, savedLog:[], boss:null, challenge:null, impRedeemed:{}, todayChoice:null, weekGoal:null };
}
let saveTimer = null;
function saveState(now){
  clearTimeout(saveTimer);
  if (now) return Store.set('state', S);
  saveTimer = setTimeout(() => Store.set('state', S), 500);
}
async function loadMonth(k){
  if (M[k]) return M[k];
  const d = await Store.get('m-' + k);
  M[k] = d && Array.isArray(d.expenses) ? d : { expenses: [] };
  return M[k];
}
function saveMonth(k){ return Store.set('m-' + k, M[k]); }
const expOn = d => (M[monthKey(d)] ? M[monthKey(d)].expenses : []).filter(e => e.d === d);
const spentOn = d => round2(expOn(d).reduce((a, e) => a + e.amount, 0));
const isHead = e => !(e.part > 0);             /* dépense étalée : seule la 1re part compte comme achat */
const fullAmt = e => e.total || e.amount;
const impOn = d => expOn(d).filter(e => e.intent === 'impulsion' && isHead(e));
const enemyOn = d => round2(expOn(d).filter(e => e.cat === 'enemy' && isHead(e)).reduce((a, e) => a + fullAmt(e), 0));

/* ---------- Moteur budgétaire ---------- */
function payDayOf(y, m){ const p = S.settings.payday || '1'; const n = dim(y, m); return p === 'last' ? n : Math.min(num(p) || 1, n); }
function period(d){
  const dt = parse(d); let y = dt.getFullYear(), m = dt.getMonth();
  let sd = payDayOf(y, m);
  if (dt.getDate() < sd) { m -= 1; if (m < 0) { m = 11; y -= 1; } sd = payDayOf(y, m); }
  const start = ymd(new Date(y, m, sd, 12));
  let ny = y, nm = m + 1; if (nm > 11) { nm = 0; ny += 1; }
  const end = addDays(ymd(new Date(ny, nm, payDayOf(ny, nm), 12)), -1);
  const len = Math.round((parse(end) - parse(start)) / 864e5) + 1;
  return { start, end, len };
}
function monthlyFree(){ const s = S.settings; return num(s.income) + num(s.other) - num(s.fixed) - num(s.saving); }
function base(d){ return monthlyFree() / period(d || today()).len; }
const configured = () => num(S.settings.income) > 0;

function ensureBoss(d){
  const k = monthKey(d);
  if (!S.boss || S.boss.month !== k) S.boss = { month:k, hp:500, max:500, log:[], enemy:S.settings.enemy || 'CBD', won:false };
}
function bossLog(d, delta, txt){ S.boss.log.unshift({ d, delta, txt }); S.boss.log = S.boss.log.slice(0, 12); }
function bossDay(d){
  if (!(S.settings.enemy || '').trim()) return;
  ensureBoss(d);
  const B = S.boss, name = S.settings.enemy;
  if (S.settings.rule === 'stop') {
    if (enemyOn(d) > 0) { B.hp = Math.min(B.max, B.hp + 30); bossLog(d, 30, 'achat de ' + name); }
    else { B.hp = Math.max(0, B.hp - 50); bossLog(d, -50, 'journée sans ' + name); }
  } else if (dow(d) === 6) {
    let w = 0; for (let i = 0; i < 7; i++) w += enemyOn(addDays(d, -i));
    const cap = num(S.settings.weeklyCap);
    if (w <= cap) { B.hp = Math.max(0, B.hp - 120); bossLog(d, -120, 'semaine sous ' + money(cap)); }
    else { B.hp = Math.min(B.max, B.hp + 60); bossLog(d, 60, 'plafond dépassé (' + money(w) + ')'); }
  }
  if (B.hp <= 0) B.won = true;
}
function challengeDay(d){
  const C = S.challenge; if (!C || !C.active || d < C.start) return;
  if (impOn(d).length) { C.active = false; C.brokenOn = d; return; }
  C.days += 1;
  const k = monthKey(d); const pot = impTotal(k) - (S.impRedeemed[k] || 0);
  const r = Math.min(5, Math.max(0, pot));
  S.impRedeemed[k] = round2((S.impRedeemed[k] || 0) + r);
  if (C.days >= 7) C.active = false;
}
function impTotal(k){ return round2((M[k] ? M[k].expenses : []).filter(e => e.intent === 'impulsion' && isHead(e)).reduce((a, e) => a + fullAmt(e), 0)); }
function logSaved(d, amt){ S.savedLog.push({ d, a: round2(amt) }); if (S.savedLog.length > 120) S.savedLog = S.savedLog.slice(-120); }

function closeDay(d, choice){
  const b = base(d), carryIn = S.carry, avail = b + carryIn, spent = spentOn(d);
  const left = avail - spent;
  const c = choice || (S.todayChoice && S.todayChoice.d === d ? S.todayChoice.c : (S.settings.evening === 'save' ? 'save' : 'carry'));
  if (left > 0 && c === 'save') { S.cagnotte = round2(S.cagnotte + left); logSaved(d, left); S.carry = 0; }
  else S.carry = round2(left);
  S.dayLog[d] = { s: spent, a: round2(avail), b: round2(b) };
  if (spent <= avail + 0.004) { S.streak += 1; if (S.streak > S.bestStreak) { S.bestStreak = S.streak; if (S.streak >= 3) S.celebrate = S.streak; } }
  else S.streak = 0;
  const p = period(d);
  if ((S.settings.expire === 'week' && dow(d) === 6) || (S.settings.expire === 'month' && d === p.end)) {
    if (S.carry > 0) { S.cagnotte = round2(S.cagnotte + S.carry); logSaved(d, S.carry); S.carry = 0; }
  }
  bossDay(d); challengeDay(d);
  S.lastClosed = d;
  const keys = Object.keys(S.dayLog).sort(); if (keys.length > 70) keys.slice(0, keys.length - 70).forEach(k => delete S.dayLog[k]);
}
async function catchUp(){
  const t = today(); let d = addDays(S.lastClosed, 1), n = 0;
  if (d < t) {
    const need = new Set(); let x = d; while (x < t && n < 400) { need.add(monthKey(x)); x = addDays(x, 1); n++; }
    for (const k of need) await loadMonth(k);
    n = 0;
    while (d < t && n < 400) { if (configured()) closeDay(d); else S.lastClosed = d; d = addDays(d, 1); n++; }
    saveState(true);
  }
}
function todayView(){
  const t = today(), closed = S.lastClosed >= t;
  const b = base(t), spent = spentOn(t);
  if (closed) { const avail = (S.dayLog[t] ? S.dayLog[t].a : b); return { closed, base:b, avail, spent, remaining:S.carry, carry:S.carry }; }
  return { closed, base:b, avail:b + S.carry, spent, remaining:b + S.carry - spent, carry:S.carry };
}

/* ---------- Ton ---------- */
function T(key, x){
  const tone = S.settings.tone;
  const L = {
    low:{ironic:'Ton Système 1 vient de prendre le volant. Ralentis.', coach:'Moins de ' + S.settings.threshold + ' % restant. On lève le pied.', sober:'Moins de ' + S.settings.threshold + ' % du budget restant.'},
    over:{ironic:'Dépassé de ' + x + '. Ton Système 1 a gagné cette manche.', coach:'Dépassé de ' + x + '. Demain, on rattrape.', sober:'Dépassement de ' + x + ', déduit de demain.'},
    ok:{ironic:'Ce que tu gardes passe à demain. Ton futur toi dit merci.', coach:'Tu tiens le rythme. Continue.', sober:'Le reste est reporté à demain.'},
    closed:{ironic:'Journée bouclée. Ton Système 2 dort tranquille.', coach:'Bilan fait. Belle discipline.', sober:'Journée clôturée.'},
    jar:{ironic:'dépensés sur un coup de tête ce mois-ci', coach:'d\'impulsions ce mois-ci. On peut faire mieux.', sober:'d\'achats impulsifs ce mois-ci'},
    nudge:{ironic:'Rien noté aujourd\'hui ? Même un café compte.', coach:'Note tes dépenses du jour, ça prend 10 secondes.', sober:'Aucune dépense saisie aujourd\'hui.'},
    recapTitle:{ironic:'Belle semaine.', coach:'Semaine bouclée.', sober:'Résumé de la semaine.'},
    recapBad:{ironic:'Semaine compliquée. Ton Système 1 a fait la fête.', coach:'Semaine difficile. On repart lundi.', sober:'Semaine au-dessus du budget.'}
  };
  return (L[key] && (L[key][tone] || L[key].ironic)) || '';
}

/* ---------- Ambiance ---------- */
const PH = {
  golden:{ name:'Golden hour', g1:'#FFE08A', g2:'#FFB347', g3:'#FF7A59', glow:'rgba(255,179,71,0.55)', bg:'#120A0E', orbs:['#FFB347','#FFE08A','#FF7A59'] },
  sunset:{ name:'Coucher de soleil', g1:'#FFD36E', g2:'#FF7A59', g3:'#E8407A', glow:'rgba(255,122,89,0.55)', bg:'#0F0714', orbs:['#FF7A59','#FFC65C','#8E3FD1'] },
  dusk:{ name:'Crépuscule', g1:'#FF8A6A', g2:'#E8407A', g3:'#8E3FD1', glow:'rgba(232,64,122,0.55)', bg:'#0B0614', orbs:['#E8407A','#8E3FD1','#4A2A9F'] },
  night:{ name:'Nuit', g1:'#E07BFF', g2:'#9A86FF', g3:'#5A6BFF', glow:'rgba(154,134,255,0.5)', bg:'#06050F', orbs:['#4A3AAF','#2A2A7F','#8E3FD1'] }
};
function phaseFor(tv){
  const a = S.settings.amb;
  if (a === 'sunset') return 'sunset'; if (a === 'night') return 'night';
  if (!configured()) return 'sunset';
  const r = tv.avail > 0 ? tv.remaining / tv.avail : 0;
  if (tv.remaining < 0) return 'night';
  return r < .25 ? 'dusk' : r < .6 ? 'sunset' : 'golden';
}
function applyTheme(key){
  const th = PH[key], app = $('#app');
  app.style.setProperty('--g1', th.g1); app.style.setProperty('--g2', th.g2); app.style.setProperty('--g3', th.g3); app.style.setProperty('--glow', th.glow);
  app.style.backgroundColor = th.bg; document.body.style.background = th.bg;
  ['#orbA','#orbB','#orbC'].forEach((s, i) => { $(s).style.backgroundColor = th.orbs[i]; });
}

/* ---------- Retour sensoriel ---------- */
function buzz(p){ if (!S.settings.vibe) return; try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
let toastTimer = null;
function toast(msg){
  const o = $('#app'); const old = $('.toast', o); if (old) old.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; o.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}
function rain(){
  const l = document.createElement('div'); l.className = 'layer'; l.setAttribute('aria-hidden', 'true');
  let h = '';
  for (let i = 0; i < 20; i++) { const bill = i % 3 === 0; h += '<div class="drop ' + (i % 2 ? 'l' : 'r') + '" style="left:' + ((i * 61) % 92) + '%;animation-delay:' + ((i * 83) % 700) + 'ms;animation-duration:' + (1300 + (i * 137) % 800) + 'ms"><div class="' + (bill ? 'bill' : 'coin') + '">€</div></div>'; }
  l.innerHTML = h; $('#app').appendChild(l); setTimeout(() => l.remove(), 3200);
}
function particles(el){
  if (!el) return; const cols = ['#FFC65C', '#FF7A59', '#E8407A'];
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, s = document.createElement('span'); s.className = 'pt'; s.style.background = cols[i % 3]; s.style.boxShadow = '0 0 8px ' + cols[i % 3]; s.style.setProperty('--dx', Math.cos(a) * 52 + 'px'); s.style.setProperty('--dy', Math.sin(a) * 52 + 'px'); el.appendChild(s); setTimeout(() => s.remove(), 900); }
}

/* ---------- Icônes ---------- */
const I = {
  plus:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFC65C" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

  close:'<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#BFAFC8" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#BFAFC8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  next:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E07BFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  flame:'<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFC65C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-10z"/></svg>',
  sliders:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#BFAFC8" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  check:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFC65C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  bolt:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFC65C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  up:'<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFC65C" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  arrow:'<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF8A6A" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
};
const intentColor = { besoin:'#FFC65C', envie:'#FF7A59', impulsion:'#FF4F8B' };

/* ---------- Biais ---------- */
const BIASES = [

  const dots = days.map(d => { const on = d <= t && d >= S.startDate && !impOn(d).length; const past = d <= t; return '<div style="height:8px;border-radius:4px;background:' + (on ? 'var(--violet)' : past ? 'rgba(255,79,139,.5)' : 'rgba(255,241,232,.08)') + ';box-shadow:' + (on ? '0 0 8px rgba(224,123,255,.6)' : 'none') + '"></div>'; }).join('');

    '<div class="row" style="align-items:flex-end"><div class="stack" style="gap:2px"><span class="kicker">' + d0.getDate() + ' ' + MONTHS[d0.getMonth()].slice(0,4) + '. au ' + d6.getDate() + ' ' + MONTHS[d6.getMonth()].slice(0,4) + '.</span><span class="h1">Ta semaine</span></div><span class="chip">' + money(b * 7) + ' / sem.</span></div>' +
    (configured() ? '<div class="stack" style="gap:2px;margin-top:16px"><span class="kicker" style="font-size:13px;color:var(--gold);letter-spacing:.12em">' + (ahead >= 0 ? 'D\'avance cette semaine' : 'De retard cette semaine') + '</span><span class="hero-num' + (ahead < 0 ? ' alert' : '') + '" style="font-size:68px;align-self:flex-start">' + (ahead >= 0 ? '+' : '') + moneyNum(ahead) + '<small>€</small></span><span class="p muted">' + (S.settings.expire === 'week' ? 'Ce qui reste dimanche soir part dans ta cagnotte.' : 'Par rapport à ton rythme de ' + money(b) + ' par jour.') + '</span></div>' : '<div class="card"><span class="p muted">Configure ton budget dans les réglages pour voir ta semaine.</span></div>') +
    '<div class="card" style="padding:20px 16px 14px"><span class="neon"></span><div class="row" style="padding-bottom:12px"><span class="kicker" style="color:var(--muted)">Jour par jour</span><span class="small dim">' + money(spentW) + ' dépensés</span></div>' +

}

  return '<div class="page">' +

  const ratio = tv.avail > 0 ? Math.max(0, Math.min(1, kept / tv.avail)) : 0;

  const svg = '<div class="gauge" style="height:270px"><svg aria-hidden="true" width="390" height="270" viewBox="0 0 390 270"><defs><linearGradient id="bArc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF8A6A"/><stop offset="0.55" stop-color="#E8407A"/><stop offset="1" stop-color="#8E3FD1"/></linearGradient><linearGradient id="bHor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8407A" stop-opacity="0"/><stop offset="0.5" stop-color="#E8407A"/><stop offset="1" stop-color="#E8407A" stop-opacity="0"/></linearGradient></defs><circle class="twinkle" cx="60" cy="40" r="1.4" fill="#FFF1E8"/><circle class="twinkle" cx="330" cy="30" r="1.2" fill="#FFF1E8" style="animation-delay:.8s"/><path d="M65 190 A130 130 0 0 1 325 190" fill="none" stroke="rgba(255,241,232,0.07)" stroke-width="12" stroke-linecap="round"/><path d="M65 190 A130 130 0 0 1 325 190" pathLength="100" fill="none" stroke="url(#bArc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (ratio > 0 ? (ratio * 100).toFixed(1) : '0.01') + ' 100" style="filter:drop-shadow(0 0 2px #E8407A) drop-shadow(0 0 12px rgba(232,64,122,.55))"/><line x1="-200" y1="190" x2="590" y2="190" stroke="url(#bHor)" stroke-width="1.5" style="filter:drop-shadow(0 0 6px #E8407A)"/><line class="shimmer" x1="145" y1="210" x2="245" y2="210" stroke="#FF8A6A" stroke-width="2" stroke-linecap="round"/></svg><div class="center" style="top:92px"><span class="kicker" style="font-size:13px;color:#FF8FB0;letter-spacing:.12em">' + (kept >= 0 ? 'Tu as gardé' : 'Dépassé de') + '</span><span class="hero-num' + (kept < 0 ? ' alert' : '') + '" style="font-size:72px;--g1:#FF8A6A;--g2:#E8407A;--glow:rgba(232,64,122,.5)">' + moneyNum(Math.abs(kept)) + '<small>€</small></span></div><span class="under" style="top:246px">' + n + ' dépense' + (n > 1 ? 's' : '') + ' · ' + money(tv.spent) + ' sur ' + money(tv.avail) + '</span></div>';
  if (tv.closed) {
    const c = S.todayChoice && S.todayChoice.d === t ? S.todayChoice.c : 'carry';
    return '<div class="page sub">' + head + svg + '<div class="card gold stack pop" style="align-items:center;text-align:center;padding:30px 20px 18px;gap:10px"><span class="neon" style="--nc:var(--gold)"></span><span class="num" style="font-size:40px;color:var(--gold);text-shadow:0 0 18px rgba(255,198,92,.5)">' + (c === 'save' ? money(S.cagnotte) : money(S.carry)) + '</span><span class="p muted">' + (c === 'save' ? 'dans ta cagnotte. ' : 'reportés à demain. ') + esc(T('closed')) + '</span><button type="button" class="btn ghost" data-go="jour">Retour à l\'accueil</button></div></div>';
  }
  const choices = kept > 0.004
    ? '<div class="stack" style="gap:12px;margin-top:auto"><span class="kicker" style="color:var(--muted)">Qu\'est-ce que tu en fais ?</span><button type="button" class="card row" data-close="carry" style="min-height:76px;padding:0 20px;color:var(--fg);text-align:left;cursor:pointer"><span class="neon" style="--nc:#FF8A6A"></span><span class="stack" style="gap:2px"><span style="font-size:16px;font-weight:600">Reporter à demain</span><span class="small muted" style="font-size:13px">Demain : <span class="num" style="color:#FF8A6A">' + money(base(addDays(t, 1)) + kept) + '</span> à dépenser</span></span>' + I.arrow + '</button>' +
      '<button type="button" class="cta" data-close="save" style="min-height:76px;border-radius:38px;padding:0 10px 0 22px"><span class="stack" style="gap:2px"><span style="font-size:16px;font-weight:600">Mettre en cagnotte</span><span style="font-size:13px;font-weight:500">Elle passera à ' + money(S.cagnotte + kept) + '</span></span><span class="knob" style="width:52px;height:52px">' + I.up + '</span></button></div>'
    : '<div class="stack" style="gap:12px;margin-top:auto"><span class="p muted">' + (kept < -0.004 ? 'Le dépassement sera retiré du budget de demain. Pas de drame, on rattrape.' : 'Pile à zéro. Rien à reporter.') + '</span><button type="button" class="cta" data-close="carry" style="justify-content:center">Clôturer la journée</button></div>';
  return '<div class="page sub" style="min-height:100%;box-sizing:border-box">' + head + svg + '<button type="button" class="btn ghost" data-go="saisie" style="align-self:center">Une dépense oubliée ? On ne juge pas.</button>' + choices + '</div>';
}

function vRecap(){
  const t = today(), days = weekDays(t), past = days.filter(d => d < t && S.dayLog[d]);
  const under = past.filter(d => S.dayLog[d].s <= S.dayLog[d].a + 0.004).length;
  const saved = round2(S.savedLog.filter(x => x.d >= days[0] && x.d <= days[6]).reduce((a, x) => a + x.a, 0));
  const imps = days.filter(d => d <= t).flatMap(d => impOn(d));
  const impSum = round2(imps.reduce((a, e) => a + fullAmt(e), 0));
  const big = imps.slice().sort((a, b) => fullAmt(b) - fullAmt(a))[0];
  const good = past.length === 0 || under >= past.length / 2;
  const goalSet = S.weekGoal && S.weekGoal.week === addDays(days[0], 7);
  return '<div class="page sub" style="position:relative">' +
    '<div aria-hidden="true" style="position:absolute;left:40px;top:-80px;width:340px;height:300px;border-radius:50%;background:#E8407A;opacity:.25;filter:blur(90px);z-index:-1"></div>' +
    '<div class="row"><span class="kicker" style="color:var(--gold)">Semaine du ' + parse(days[0]).getDate() + ' ' + MONTHS[parse(days[0]).getMonth()] + '</span><button type="button" class="icon-btn" data-go="semaine" aria-label="Fermer">' + I.close + '</button></div>' +
    '<span class="h1 enter" style="font-size:42px;line-height:1.05">' + esc(good ? T('recapTitle') : T('recapBad')) + '</span>' +
    '<div class="stack" style="gap:12px;margin-top:14px">' +
    '<div class="card row enter" style="padding:20px;animation-delay:.2s"><span class="neon" style="--nc:var(--gold)"></span><span style="font-size:15px">jours sous ton budget</span><span class="num" style="font-size:40px;line-height:1;color:var(--gold);text-shadow:0 0 18px rgba(255,198,92,.45)">' + under + '/' + Math.max(past.length, 0) + '</span></div>' +
    '<div class="card row enter" style="padding:20px;animation-delay:.4s"><span class="neon"></span><span style="font-size:15px">envoyés en cagnotte</span><span class="num" style="font-size:40px;line-height:1;color:var(--peach);text-shadow:0 0 18px rgba(255,122,89,.45)">+' + money(saved) + '</span></div>' +
    '<div class="card rose stack enter" style="padding:20px;animation-delay:.6s"><span class="neon" style="--nc:var(--alert)"></span><div class="row"><span style="font-size:15px">impulsions</span><span class="num" style="font-size:40px;line-height:1;color:var(--alert);text-shadow:0 0 18px rgba(255,79,139,.45)">' + imps.length + '</span></div><span class="small" style="font-size:13px;color:#CDBBD6">' + (imps.length ? money(impSum) + ' au total. La plus chère : ' + esc(big.label) + ', ' + DAYS[dow(big.d)] + ' à ' + new Date(big.ts).getHours() + ' h.' : 'Aucune. Ton Système 2 a tenu la barre.') + '</span></div></div>' +
    (goalSet ? '<span class="p" style="text-align:center;color:var(--violet)">Objectif fixé : ' + S.weekGoal.max + ' impulsion max la semaine prochaine.</span>' : '<button type="button" class="btn" data-act="weekGoal" style="min-height:60px;border-radius:30px;background:var(--fg);color:var(--ink);border:none;box-shadow:0 0 24px -4px rgba(255,241,232,.45)">Objectif semaine prochaine : 1 impulsion max</button>') +
    '</div>';
}

function field(id, label, opts){
  const v = S.settings[id];

  return '<label class="field"><span class="flab">' + label + (opts.check && num(v) > 0 ? ok : '') + '</span><span class="fin"><input id="s_' + id + '" data-set="' + id + '" class="' + (opts.size || 'big') + '" type="' + (opts.text ? 'text' : 'number') + '" ' + (opts.text ? '' : 'inputmode="decimal" min="0" step="0.01"') + ' placeholder="' + (opts.ph || '0') + '" value="' + esc(v) + '">' + (opts.text ? '' : '<span class="unit">€</span>' + (opts.per ? '<span class="per">/ mois</span>' : '')) + '</span>' + (opts.hint ? '<span class="hint">' + opts.hint + '</span>' : '') + '</label>';
}
function seg(key, opts, color, cols){

function sw(key, label, hint){ return '<div class="row" style="min-height:62px;border-bottom:1px solid rgba(255,241,232,.06)"><span class="stack" style="gap:2px"><span style="font-size:15px;font-weight:500">' + label + '</span><span class="small dim">' + hint + '</span></span><button type="button" class="switch" role="switch" data-sw="' + key + '" aria-checked="' + !!S.settings[key] + '" aria-label="' + label + '"></button></div>'; }

    (configured() ? '<div class="row" style="align-items:flex-end"><span class="hero-num" style="font-size:54px">' + moneyNum(daily) + '<small>€</small></span><span class="stack small muted" style="gap:2px;align-items:flex-end;padding-bottom:6px"><span>' + money(daily * 7) + ' / sem.</span><span>' + money(free) + ' / période</span></span></div><span class="small" style="font-size:13px;color:' + vc + '">' + verdict + '</span><span class="small dim">Période du ' + fmtDay(p.start) + ' au ' + fmtDay(p.end) + ', ' + p.len + ' jours.</span>' : '<span class="p">Remplis les 3 étapes, je calcule ce que tu peux dépenser chaque jour.</span>') + '</div>' +

    step(2, 'Ce qui part') +

      '<label class="field" style="border:none;border-radius:0"><span class="flab">Montant à atteindre</span><span class="fin"><input id="s_goalAmount" data-set="goalAmount" class="mid" type="number" inputmode="decimal" min="0" placeholder="0" value="' + esc(s.goalAmount) + '"><span class="unit">€</span></span></label></div>' +
    '<div class="row" style="gap:10px;margin:22px 4px 0"><span style="flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,241,232,.18))"></span><span class="kicker">Options</span><span style="flex:1;height:1px;background:linear-gradient(90deg,rgba(255,241,232,.18),transparent)"></span></div>' +

      '<div class="row" style="min-height:62px"><span class="stack" style="gap:2px"><span style="font-size:15px;font-weight:500">Animations réduites</span><span class="small dim">Moins de mouvement</span></span><button type="button" class="switch" role="switch" data-sw="reduced" aria-checked="' + !!s.reduced + '" aria-label="Animations réduites"></button></div></div>' +

/* ---------- Pot des impulsions ---------- */
function jarSheet(added){
  const k = monthKey(today()), total = impTotal(k), red = S.impRedeemed[k] || 0, pot = Math.max(0, round2(total - red));
  const lvl = Math.min(100, pot / 100 * 100), from = Math.min(100, Math.max(0, pot - added) / 100 * 100);
  const C = S.challenge;
  const challenge = C && C.active
    ? '<div class="card gold stack" style="gap:10px"><span class="neon" style="--nc:var(--gold)"></span><div class="row"><span class="kicker" style="color:var(--gold)">Défi en cours</span><span class="num" style="color:var(--gold)">' + C.days + ' / 7 j</span></div><span class="p">Il vient de casser ton défi « 0 impulsion ». Relance-le quand tu veux.</span></div>'
    : '<button type="button" class="cta" data-act="challenge" style="justify-content:center">Défi : 0 impulsion demain</button>';
  return '<div class="sheet-wrap" data-act="closeSheet"><div class="sheet" role="dialog" aria-label="Pot des impulsions" data-stop="1">' +
    '<div class="row"><span class="kicker" style="color:var(--alert)">Pot des impulsions · ' + MONTHS[parse(today()).getMonth()] + '</span><span class="num" style="font-size:14px;color:var(--alert)">+' + money(added) + '</span></div>' +
    '<div class="row" style="justify-content:flex-start;gap:22px"><div class="jar"><div class="neck"></div><div class="body"><div class="liquid" id="jarLiquid" style="height:' + from + '%"><div class="wave"></div></div><span class="falling" aria-hidden="true"></span></div></div><div class="stack" style="gap:4px;min-width:0"><span class="num" id="jarNum" style="font-size:38px;line-height:1;color:var(--alert);text-shadow:0 0 24px rgba(255,79,139,.4)">' + money(pot - added) + '</span><span class="p muted">' + esc(T('jar')) + '</span></div></div>' +
    '<div class="stack" style="gap:10px"><span class="h2">Avec ça, j\'aurais pu…</span>' +
    [[Math.floor(pot / 2.8), 'cafés en terrasse'], [Math.floor(pot / 12), 'places de ciné'], [(pot / Math.max(1, base())).toFixed(1).replace('.', ',') + ' j', 'de budget quotidien en plus']].map((e, i) => '<div class="row row-in" style="justify-content:flex-start;align-items:baseline;gap:12px;min-height:40px;border-top:1px solid #2E1630;padding-top:8px;animation-delay:' + (900 + i * 150) + 'ms"><span class="num" style="font-size:22px;color:var(--gold);min-width:64px">' + e[0] + '</span><span>' + e[1] + '</span></div>').join('') + '</div>' +
    challenge + '<button type="button" class="btn ghost" data-act="closeSheet">J\'ai compris</button></div></div>';
}

/* ---------- Rendu ---------- */
function render(){
  const tv = todayView();
  applyTheme(view === 'bilan' ? 'dusk' : view === 'boss' ? 'night' : phaseFor(tv));
  $('#app').classList.toggle('calm', !!S.settings.reduced);
  const tabs = $('#tabs'), tabViews = ['jour','semaine','journal','mois','boss'];
  tabs.hidden = !tabViews.includes(view);
  tabs.querySelectorAll('button').forEach(b => { if (b.dataset.go === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const html = { jour:vJour, semaine:vSemaine, journal:vJournal, mois:vMois, boss:vBoss, saisie:vSaisie, bilan:vBilan, recap:vRecap, reglages:vReglages }[view]();
  const sc = $('#scroll'); sc.innerHTML = html;
  if (view === 'jour') afterJour(tv);
}
function afterJour(tv){
  const el = $('#bigNum'); const to = tv.remaining;
  if (el && ui.lastShown != null && Math.abs(ui.lastShown - to) > 0.004) {
    const from = ui.lastShown, t0 = performance.now(), d = 800;
    const step = now => { const p = Math.min(1, (now - t0) / d), e = 1 - Math.pow(1 - p, 3), v = from + (to - from) * e; el.firstChild.nodeValue = moneyNum(v); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
    const arc = $('#arc'); if (arc && arc.animate && tv.avail > 0) { const r0 = Math.max(0, Math.min(1, from / tv.avail)) * 100, r1 = Math.max(0, Math.min(1, to / tv.avail)) * 100; arc.animate([{ strokeDasharray: (r0 || 0.01) + ' 100' }, { strokeDasharray: (r1 || 0.01) + ' 100' }], { duration: 1000, easing: 'cubic-bezier(.2,.8,.2,1)' }); }
  }
  ui.lastShown = to;
  if (S.celebrate) { const n = S.celebrate; S.celebrate = 0; saveState(); setTimeout(() => { particles($('#streakWrap')); toast('Record battu : ' + n + ' jours d\'affilée sous ton budget.'); buzz([20, 40, 20]); }, 400); }
}
async function go(v, opt){
  if (v === 'saisie') ui.saisie = { amount:'', intent:null, cat:'Repas', note:'', spread:1, d:(opt && opt.d) || today(), back:(opt && opt.back) || 'jour' };
  if (v === 'journal') { const t = today(), p = parse(t); await loadMonth(monthKey(t)); await loadMonth(ymd(new Date(p.getFullYear(), p.getMonth() - 1, 1, 12)).slice(0, 7)); }
  if (v !== 'reglages') ui.confirmReset = false;
  view = v; render(); $('#scroll').scrollTop = 0;
}

/* ---------- Actions ---------- */
async function addExpense(){
  const st = ui.saisie, amt = round2(num(st.amount)); if (!(amt > 0) || !st.intent) return;
  const t = st.d || today(), label = st.note.trim() || (st.cat === 'enemy' ? (S.settings.enemy || 'Ennemi') : st.cat);
  const now = new Date(), when = t === today() ? now.getTime() : (() => { const x = parse(t); x.setHours(now.getHours(), now.getMinutes()); return x.getTime(); })();
  /* Étalement : une part par jour à partir de la date de la dépense, l'arrondi va sur la 1re */
  const n = st.spread || 1, g = n > 1 ? uid() : null;
  const per = Math.floor(amt * 100 / n) / 100, first = round2(amt - per * (n - 1)), touched = new Set();
  let closedChange = false;
  for (let i = 0; i < n; i++) {
    const d = addDays(t, i), km = monthKey(d), a = i ? per : first; await loadMonth(km); touched.add(km);
    const e = { id: uid(), ts: when, d, amount: a, label, cat: st.cat, intent: st.intent };
    if (g) Object.assign(e, { g, part: i, parts: n, total: amt });
    M[km].expenses.push(e);
    if (S.lastClosed >= d) { S.carry = round2(S.carry - a); if (S.dayLog[d]) S.dayLog[d].s = round2(S.dayLog[d].s + a); closedChange = true; }
  }
  if (closedChange) saveState();
  touched.forEach(saveMonth);
  if (st.intent === 'impulsion') {
    buzz([80, 40, 80, 40, 160]);
    ui.sheet = { added: amt };
    $('#overlay').innerHTML = jarSheet(amt);
    setTimeout(() => { const k2 = monthKey(today()), pot = Math.max(0, impTotal(k2) - (S.impRedeemed[k2] || 0)); const l = $('#jarLiquid'); if (l) l.style.height = Math.min(100, pot) + '%'; const n = $('#jarNum'); if (n) { const f = pot - amt, t0 = performance.now(); const s = now => { const p = Math.min(1, (now - t0) / 1100), v = f + (pot - f) * (1 - Math.pow(1 - p, 3)); n.textContent = money(v); if (p < 1) requestAnimationFrame(s); }; requestAnimationFrame(s); } }, 450);
  } else {
    buzz([30, 50, 30]); rain(); toast(n > 1 ? 'Étalée sur ' + n + ' jours : ' + money(amt / n) + ' par jour' : 'Dépense ajoutée : ' + money(amt));
    setTimeout(() => { if (view === 'saisie') go(st.back || 'jour'); }, 1400);
  }
}
async function delExpense(id){
  const k = Object.keys(M).find(m => M[m].expenses.some(x => x.id === id)); if (!k) return;
  const e = M[k].expenses.find(x => x.id === id);
  const keys = new Set([k]);
  if (e.g) { const s0 = addDays(e.d, -e.part); for (let i = 0; i < e.parts; i++) keys.add(monthKey(addDays(s0, i))); }
  let back = 0;
  for (const km of keys) {
    await loadMonth(km);
    M[km].expenses = M[km].expenses.filter(x => {
      const hit = e.g ? x.g === e.g : x.id === id;
      if (hit && x.d <= S.lastClosed) { back += x.amount; if (S.dayLog[x.d]) S.dayLog[x.d].s = round2(Math.max(0, S.dayLog[x.d].s - x.amount)); }
      return !hit;
    });
    saveMonth(km);
  }
  if (back) { S.carry = round2(S.carry + back); saveState(); }
  render(); toast(e.g ? 'Dépense étalée supprimée en entier' : 'Dépense supprimée');
}
function closeToday(c){
  const t = today();
  S.todayChoice = { d: t, c };
  closeDay(t, c); saveState(true);
  if (c === 'save') { rain(); buzz([30, 50, 30]); }
  render();
}
async function exportCsv(){
  const keys = new Set(); Object.keys(M).forEach(k => keys.add(k));
  let d = S.startDate; let guard = 0; while (d <= today() && guard < 40) { keys.add(monthKey(d)); const p = parse(d); d = ymd(new Date(p.getFullYear(), p.getMonth() + 1, 1, 12)); guard++; }
  for (const k of keys) await loadMonth(k);
  const rows = [['date','heure','montant','libellé','catégorie','intention','étalement']];
  Array.from(keys).sort().forEach(k => M[k].expenses.slice().sort((a, b) => a.ts - b.ts).forEach(e => { const dt = new Date(e.ts); rows.push([e.d, pad(dt.getHours()) + ':' + pad(dt.getMinutes()), e.amount.toFixed(2).replace('.', ','), e.label, e.cat === 'enemy' ? (S.settings.enemy || 'ennemi') : e.cat, e.intent, e.g ? (e.part + 1) + '/' + e.parts : '']); }));
  const csv = '﻿' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  try {
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' }), url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'systeme2-depenses-' + today() + '.csv'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Export prêt : enregistre-le dans Fichiers.');
  } catch (e) { toast('Export impossible sur cet appareil.'); }
}
async function resetMonth(){
  const k = monthKey(today()); await loadMonth(k);
  const gs = new Set(M[k].expenses.filter(e => e.g).map(e => e.g));
  if (gs.size) { const p = parse(today()), nk = monthKey(ymd(new Date(p.getFullYear(), p.getMonth() + 1, 1, 12))); await loadMonth(nk); M[nk].expenses = M[nk].expenses.filter(e => !gs.has(e.g)); await saveMonth(nk); }
  M[k] = { expenses: [] }; await saveMonth(k);
  S.carry = 0; S.boss = null; S.challenge = null; S.impRedeemed[k] = 0; S.lastClosed = addDays(today(), -1); S.streak = 0; S.todayChoice = null;
  Object.keys(S.dayLog).forEach(d => { if (monthKey(d) === k) delete S.dayLog[d]; });
  ui.confirmReset = false; ui.lastShown = null; saveState(true); render(); toast('Mois remis à zéro. Ta cagnotte est intacte.');
}

/* ---------- Événements ---------- */
document.addEventListener('click', ev => {
  if (!S) return;
  const t = ev.target.closest('button, a, .sheet-wrap'); if (!t) return;
  if (t.classList.contains('sheet-wrap') && ev.target !== t) return;
  const d = t.dataset;
  if (d.go) { go(d.go); return; }
  if (d.jr) { ui.journal.range = d.jr; ui.journal.cat = null; render(); return; }
  if (d.jcat !== undefined) { ui.journal.cat = ui.journal.cat === d.jcat ? null : d.jcat; render(); return; }
  if (d.addon) { go('saisie', { d: d.addon, back: 'journal' }); return; }
  if (d.note) { ui.editNote = d.note; render(); const f = $('#dnote'); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } return; }
  if (d.del) { delExpense(d.del); return; }
  if (d.close) { closeToday(d.close); return; }
  if (d.key) { const st = ui.saisie; let a = st.amount; const k = d.key;
    if (k === 'del') a = a.slice(0, -1); else if (k === ',') { if (a.indexOf(',') < 0) a = (a || '0') + ','; } else if (a.indexOf(',') < 0 ? a.replace(/^0/, '').length < 5 : a.split(',')[1].length < 2) a = (a === '0' ? '' : a) + k;
    st.amount = a; render(); return; }
  if (d.intent) { ui.saisie.intent = d.intent; buzz({ besoin:[15], envie:[25,70,25], impulsion:[80,40,80,40,160] }[d.intent]); render(); return; }
  if (d.cat) { ui.saisie.cat = d.cat; render(); return; }
  if (d.spread) { ui.saisie.spread = +d.spread; render(); return; }
  if (d.seg) { const v = d.val; S.settings[d.seg] = d.seg === 'threshold' ? +v : v; saveState(); render(); return; }
  if (d.sw) { S.settings[d.sw] = !S.settings[d.sw]; saveState(); render(); return; }
  switch (d.act) {
    case 'nextBias': ui.biasShift++; render(); break;
    case 'save': addExpense(); break;
    case 'closeSheet': $('#overlay').innerHTML = ''; ui.sheet = null; go((ui.saisie && ui.saisie.back) || 'jour'); break;
    case 'challenge': S.challenge = { start: addDays(today(), 1), days: 0, active: true }; saveState(); $('#overlay').innerHTML = ''; toast('Défi lancé. Chaque journée sans impulsion rachète 5 € du pot.'); go('jour'); break;
    case 'weekGoal': S.weekGoal = { week: addDays(weekDays(today())[0], 7), max: 1 }; saveState(); render(); break;
    case 'export': exportCsv(); break;
    case 'askReset': ui.confirmReset = true; render(); break;
    case 'cancelReset': ui.confirmReset = false; render(); break;
    case 'doReset': resetMonth(); break;
  }
});
document.addEventListener('input', ev => {
  if (!S) return; const el = ev.target;
  if (el.dataset.set) { S.settings[el.dataset.set] = el.value; saveState(); refreshBudgetCard(); }
  else if (el.dataset.range) { S.settings[el.dataset.range] = +el.value; const v = $('#thrVal'); if (v) v.textContent = el.value + ' %'; saveState(); }
  else if (el.id === 'note' && ui.saisie) ui.saisie.note = el.value;
  else if (el.id === 'useAmount') ui.useAmount = el.value;
  else if (el.id === 'jq') { ui.journal.q = el.value; const pos = el.selectionStart; render(); const f = $('#jq'); if (f) { f.focus(); f.setSelectionRange(pos, pos); } }
});
function saveNote(){ const f = $('#dnote'); if (!f || !ui.editNote) return; const d = ui.editNote, v = f.value.trim(); if (v) S.dayNotes[d] = v.slice(0, 280); else delete S.dayNotes[d]; ui.editNote = null; saveState(); render(); }
document.addEventListener('keydown', ev => { if (ev.target && ev.target.id === 'dnote' && ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); saveNote(); } if (ev.target && ev.target.id === 'dnote' && ev.key === 'Escape') { ui.editNote = null; render(); } });
document.addEventListener('focusout', ev => { if (ev.target && ev.target.id === 'dnote') setTimeout(() => { if (ui.editNote && document.activeElement && document.activeElement.id !== 'dnote') saveNote(); }, 0); });
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.dataset.form === 'use') { const a = round2(num(ui.useAmount)); if (!(a > 0)) return; if (a > S.cagnotte + 0.004) { toast('Ta cagnotte ne contient que ' + money(S.cagnotte) + '.'); return; } S.cagnotte = round2(S.cagnotte - a); ui.useAmount = ''; saveState(true); render(); toast(money(a) + ' retirés de la cagnotte. Profite.'); }
});
function refreshBudgetCard(){
  const card = $('#budgetCard'); if (!card) return;
  const tmp = document.createElement('div'); tmp.innerHTML = vReglages();
  const fresh = tmp.querySelector('#budgetCard'); if (fresh) card.innerHTML = fresh.innerHTML;
}
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && S) { const before = S.lastClosed; await catchUp(); if (S.lastClosed !== before || view === 'jour') render(); } });
setInterval(async () => { if (!S) return; const before = S.lastClosed; await catchUp(); if (S.lastClosed !== before) render(); }, 60000);

/* ---------- Démarrage ---------- */
(async function boot(){
  await Store.init();
  let st = await Store.get('state');
  if (!st || !st.settings) st = freshState();
  st.settings = Object.assign({}, DEFAULTS, st.settings);
  ['dayLog','impRedeemed','dayNotes'].forEach(k => { if (!st[k] || typeof st[k] !== 'object') st[k] = {}; });
  if (!Array.isArray(st.savedLog)) st.savedLog = [];
  S = st;
  const t = today();
  await loadMonth(monthKey(t)); await loadMonth(monthKey(addDays(t, -7)));
  await catchUp();
  if (!(await Store.get('state'))) saveState(true);
  render();
})();
})();
</script>
